<script data-goatcounter="https://realityengineer.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function(){
  var sent={};
  function send(path,title){
    if(sent[path])return; sent[path]=1;
    try{ window.goatcounter&&goatcounter.count&&goatcounter.count({path:path,title:title,event:true}); }catch(e){}
  }
  function T(id){ var e=document.getElementById(id); return e?(e.value!==undefined&&e.tagName!=="OUTPUT"?e.value:e.textContent):""; }
  function num(s){ s=String(s||"").replace(/[^\d.]/g,""); var v=parseFloat(s); return isFinite(v)?v:null; }
  function radio(n){ var e=document.querySelector('input[name="'+n+'"]:checked'); return e?e.value:""; }
  function bucket(v,edges){
    if(v===null) return null;
    for(var i=0;i<edges.length;i++){
      if(v<edges[i]){
        if(i===0) return "<"+edges[0];
        var lo=edges[i-1], hi=edges[i]-1;
        return lo===hi ? String(lo) : (lo+"-"+hi);
      }
    }
    return edges[edges.length-1]+"+";
  }

  /* ---------- 1. clicks: channel links ---------- */
  function ytPlace(a){
    var h=a.getAttribute("href")||"";
    if(a.id==="yt-sub") return ["yt-card","كرت القناة"];
    if(a.classList.contains("sub-strip")) return ["yt-strip","الشريط العلوي"];
    if(a.closest("#rv-nudge")) return ["yt-report","من التقرير النهائي"];
    if(h.indexOf("/join")>-1) return ["yt-join","عضوية القناة"];
    if(h.indexOf("/videos")>-1) return ["yt-thanks","Super Thanks"];
    if(a.closest("#support")) return ["yt-support","قسم الدعم"];
    if(a.closest("footer")) return ["yt-footer","التذييل"];
    return ["yt-other","لينك القناة"];
  }
  var MAP={
    "btn-report":"فتح التقرير النهائي",
    "sh-wa":"شارك على واتساب",
    "btn-wa":"شارك على واتساب",
    "sh-native":"شارك (مشاركة الجهاز)",
    "sh-copy":"نسخ رسالة المشاركة",
    "chan-card":"كرت القناة",
    "sup-pill":"زرار الدعم فوق",
    "coffee-btn":"دعم — كوب قهوة",
    "ipa-copy":"نسخ انستاباي",
    "rv-coffee":"دعم من التقرير",
    "rv-print":"طباعة التقرير",
    "rv-dl":"تنزيل التقرير",
    "rv-csv":"تنزيل CSV",
    "geo-go":"حدّد منطقته",
    "geo-me":"موقعي الحالي",
    "btn-save-sc":"حفظ سيناريو",
    "c-eg":"اختار مصر",
    "c-ae":"اختار الإمارات",
    "c-sa":"اختار السعودية",
    "c-in":"\u0627\u062e\u062a\u0627\u0631 \u0627\u0644\u0647\u0646\u062f",
    "lang-sw2":"\u0628\u062f\u0651\u0644 \u0627\u0644\u0644\u063a\u0629 (\u0627\u0644\u062a\u0627\u0646\u064a\u0629)",
    "lang-sw":"بدّل اللغة",
    "boq-panel":"فتح المقايسة",
    "prices-panel":"عدّل الأسعار",
    "method-panel":"شاف طريقة الحساب"
  };
  document.addEventListener("click",function(e){
    var a=e.target.closest?e.target.closest('a[href*="youtube.com"]'):null;
    if(a){
      var pl=ytPlace(a);
      send("yt/"+pl[0], "راح للقناة — "+pl[1]);
      send("yt/total", "إجمالي اللي راحوا للقناة");
      if((a.getAttribute("href")||"").indexOf("sub_confirmation")>-1)
        send("yt/subscribe","ضغط اشتراك (صفحة الاشتراك)");
      return;
    }
    var el=e.target;
    while(el&&el!==document.body){ if(el.id&&MAP[el.id]){ send("use/"+el.id, MAP[el.id]); } el=el.parentElement; }
  },true);

  /* ---------- 2. what they are building (anonymous, bucketed) ---------- */
  var CUR={ "\u20b9":"IN", "\u0631\u0648\u0628\u064a\u0629":"IN", "INR":"IN", "rupee":"IN", "\u0930\u0941\u092a\u092f\u0947":"IN", "جنيه":"EG", "درهم":"AE", "ريال":"SA", "ج.م":"EG", "د.إ":"AE", "ر.س":"SA", "EGP":"EG", "AED":"AE", "SAR":"SA", "Egyptian":"EG", "Dirham":"AE", "Riyal":"SA" };
  function country(){
    var c=(T("t-cur")||"").trim();
    for(var k in CUR){ if(c.indexOf(k)>-1) return CUR[k]; }
    var on=document.querySelector(".country .on,.country [aria-pressed=true],.country .sel");
    if(on&&on.id) return on.id.replace("c-","").toUpperCase();
    return "?";
  }
  function snapshot(){
    var co=country();
    send("who/country/"+co, "الدولة: "+co);
    var t=radio("type"); if(t) send("who/type/"+t, "نوع المبنى: "+t);
    var m=radio("mode"); if(m) send("who/mode/"+m, "طريقة التنفيذ: "+m);
    var lv=radio("level"); if(lv) send("who/finish/"+lv, "مستوى التشطيب: "+lv);
    var fl=num(T("floors-out")); if(fl!==null) send("who/floors/"+bucket(fl,[2,3,4,5,6,9]), "عدد الأدوار: "+fl);
    var fp=num(T("fp")); if(fp!==null) send("who/floor-area/"+bucket(fp,[100,150,200,300,500]), "مسطح الدور (م²)");
    var bu=num(T("t-bua")); if(bu!==null) send("who/total-area/"+bucket(bu,[200,500,1000,2000,4000]), "إجمالي المسطحات (م²)");
    var tot=num(T("t-total"));
    if(tot!==null){
      var b = co==="EG" ? bucket(tot,[2e6,5e6,10e6,20e6,50e6]) : bucket(tot,[5e5,1e6,2e6,5e6,1e7]);
      send("who/budget/"+co+"/"+b, "التكلفة التقديرية ("+co+")");
    }
    var loc=document.getElementById("loc");
    if(loc&&loc.selectedIndex>=0&&loc.options[loc.selectedIndex]){
      var rg=loc.options[loc.selectedIndex].text.trim().slice(0,40);
      if(rg) send("who/region/"+co+"/"+rg, "المنطقة: "+rg);
    }
    var dmp=document.getElementById("dump"); if(dmp&&dmp.value) send("who/dump/"+dmp.value, "\u0645\u0633\u0627\u0641\u0629 \u0627\u0644\u0645\u0642\u0644\u0628");
    var st=num(T("street")); if(st!==null&&st>0) send("who/street/"+bucket(st,[6,10,12,20]), "\u0639\u0631\u0636 \u0627\u0644\u0634\u0627\u0631\u0639 (\u0645)");
    var lang = (document.documentElement.lang || "ar").slice(0,2);
    send("who/lang/"+lang, "لغة الاستخدام: "+lang);
  }

  /* ---------- 3. quote-check results ---------- */
  var VERD=[["أقل من السوق","low"],["في نطاق السوق","fair"],["أعلى من السوق شوية","high"],["أعلى من السوق بوضوح","way-high"],["far below market","low"],["within market","fair"],["slightly above market","high"],["clearly above market","way-high"],["बाज़ार से बहुत नीचे","low"],["बाज़ार के दायरे में","fair"],["बाज़ार से थोड़ा ऊपर","high"],["बाज़ार से साफ़ तौर पर ऊपर","way-high"]];
  function watchVerdict(){
    var vEl=document.getElementById("verdict");
    if(!vEl||!window.MutationObserver) return false;
    new MutationObserver(function(){
      var hb=vEl.querySelector("b"); var txt=(hb?hb.textContent:vEl.textContent)||""; if(txt.length<4) return; txt=txt.toLowerCase();
      for(var i=0;i<VERD.length;i++){ if(txt.indexOf(VERD[i][0])>-1){ send("quote/"+VERD[i][1], "\u0646\u062a\u064a\u062c\u0629 \u0645\u0631\u0627\u062c\u0639\u0629 \u0627\u0644\u0639\u0631\u0636"); send("quote/checked","\u0631\u0627\u062c\u0639 \u0639\u0631\u0636 \u0645\u0642\u0627\u0648\u0644"); break; } }
    }).observe(vEl,{childList:true,subtree:true,characterData:true});
    return true;
  }
  if(!watchVerdict()){ var tries=0, iv=setInterval(function(){ if(watchVerdict()||++tries>60) clearInterval(iv); },500); }

  /* ---------- 4. engagement: time + scroll depth ---------- */
  [[30,"30s"],[120,"2m"],[300,"5m"]].forEach(function(p){
    setTimeout(function(){ send("stay/"+p[1], "فضل في الصفحة "+p[1]); }, p[0]*1000);
  });
  var marks=[25,50,75,100];
  addEventListener("scroll",function(){
    var h=document.documentElement.scrollHeight-innerHeight;
    if(h<=0)return;
    var pc=Math.round(scrollY/h*100);
    marks.forEach(function(m){ if(pc>=m) send("depth/"+m, "نزل لـ "+m+"% من الصفحة"); });
  },{passive:true});

  /* ---------- 5. when to take the snapshot ---------- */
  var snapped=false;
  function doSnap(){ if(snapped)return; snapped=true; snapshot(); }
  document.addEventListener("click",function(e){
    var el=e.target; while(el&&el!==document.body){ if(el.id==="btn-report"||el.id==="sh-wa"||el.id==="btn-wa"){ doSnap(); return; } el=el.parentElement; }
  },true);
  setTimeout(doSnap, 45000);
  addEventListener("pagehide", doSnap);
})();
</script>
<style>
#sgate{--g-bg:rgba(15,22,19,.55);--g-card:#ffffff;--g-ink:#16201E;--g-mut:#46544F;--g-red:#CC1F1F;--g-red-ink:#fff;--g-ok:#23794A;--g-warn-bg:#FAEBD2;--g-warn:#7a4a08;--g-line:#DDE3E0;
  position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--g-bg);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);font-family:"Noto Kufi Arabic","Noto Sans Devanagari",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}

#sgate h2{margin:0 0 6px;font-size:21px;line-height:1.4;text-wrap:balance}
#sgate .gs{margin:0 0 4px;color:var(--g-mut);font-size:14.5px;line-height:1.7}
#sgate .gch{margin:14px 0 18px;padding:10px 12px;border:1px solid var(--g-line);border-radius:14px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px}
#sgate .gch b{font-size:15.5px}

#sgate .gsteps span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--g-line);color:var(--g-ink);display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:2px}
#sgate .gb{display:flex;width:100%;box-sizing:border-box;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 18px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}
#sgate .gb.red{background:var(--g-red);color:var(--g-red-ink)}
#sgate .gb.ok{background:var(--g-ok);color:#fff;margin-top:10px}
#sgate .gb:focus-visible{outline:3px solid #C98612;outline-offset:3px}
#sgate .gmsg{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.7;background:var(--g-warn-bg);color:var(--g-warn)}
#sgate .gmsg.good{background:transparent;color:var(--g-ok);font-weight:700;font-size:15px}
#sgate .gwait{margin:12px 0 0;font-size:13px;color:var(--g-mut)}
#sgate .gfoot{margin:14px 0 0;font-size:12px;color:var(--g-mut)}
html.sgate-lock,html.sgate-lock body{overflow:hidden!important}
@media (prefers-reduced-motion:no-preference){#sgate .gc{animation:sgIn .35s ease-out}@keyframes sgIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}}
</style>
<div id="sgate" role="dialog" aria-modal="true" aria-labelledby="sg-t" hidden>
  <div class="gc">
    <div class="gi" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="#fff" d="M9 7.5v9l7.5-4.5z"/></svg></div>

<script>
(function(){
  var KEY="mizan-sub", MIN_AWAY=6000;
  try{ if(localStorage.getItem(KEY)) return; }catch(e){}
  var L="ar";
  try{ var h=(location.hash||"").slice(1), s=localStorage.getItem("mizan-lang");
    L=(h==="ar"||h==="en"||h==="hi")?h:(s==="ar"||s==="en"||s==="hi")?s:(/^hi/i.test(navigator.language||"")?"hi":"ar"); }catch(e){}
  var T={
    ar:{t:"الأداة مجانية لمشتركي القناة",s:"ميزان البناء بيتعمل ويتحدّث كل يوم على حساب قناة «مهندس الواقع». اشتراكك هو اللي بيخليها مجانية.",ch:"مهندس الواقع",n:"· أكتر من 90 ألف مشترك",
        a:"اضغط الزرار — هتفتح القناة ويطلعلك «اشتراك / Subscribe»",b:"اشترك وارجع للصفحة دي — الأداة هتفتح لوحدها",go:"اشترك في القناة",
        wait:"مستنيينك ترجع من يوتيوب…",short:"رجعت بسرعة — اتأكد إنك ضغطت «اشتراك / Subscribe» في صفحة القناة، وبعدين ارجع هنا.",again:"افتح القناة تاني",
        ok:"شكرًا لاشتراكك ✓",open:"افتح الأداة",manual:"اشتركت؟ افتح الأداة",f:"مشترك بالفعل؟ اضغط نفس الزرار وارجع — مرة واحدة بس على الجهاز ده."},
    en:{t:"Free for channel subscribers",s:"Mizan is built and updated daily by the Reality Engineer channel. Your subscription is what keeps it free.",ch:"Reality Engineer",n:"· 90K+ subscribers",
        a:"Tap the button — the channel opens with a “Subscribe” prompt",b:"Subscribe, then come back to this page — the tool unlocks by itself",go:"Subscribe to the channel",
        wait:"Waiting for you to come back from YouTube…",short:"That was quick — make sure you tapped “Subscribe” on the channel page, then come back here.",again:"Open the channel again",
        ok:"Thanks for subscribing ✓",open:"Open the tool",manual:"Subscribed? Open the tool",f:"Already subscribed? Tap the same button and come back — only once on this device."},
    hi:{t:"चैनल सब्सक्राइबर्स के लिए मुफ़्त",s:"Mizan को Reality Engineer चैनल रोज़ बनाता और अपडेट करता है। आपका सब्सक्रिप्शन ही इसे मुफ़्त रखता है।",ch:"Reality Engineer",n:"· 90 हज़ार+ सब्सक्राइबर",
        a:"बटन दबाएँ — चैनल खुलेगा और “Subscribe” दिखेगा",b:"सब्सक्राइब करें और इस पेज पर लौटें — टूल अपने-आप खुल जाएगा",go:"चैनल सब्सक्राइब करें",
        wait:"YouTube से आपके लौटने का इंतज़ार…",short:"आप बहुत जल्दी लौट आए — चैनल पेज पर “Subscribe” दबाया है, पक्का करें, फिर यहाँ लौटें।",again:"चैनल फिर खोलें",
        ok:"सब्सक्राइब करने के लिए धन्यवाद ✓",open:"टूल खोलें",manual:"सब्सक्राइब कर लिया? टूल खोलें",f:"पहले से सब्सक्राइब हैं? वही बटन दबाएँ और लौटें — इस डिवाइस पर सिर्फ़ एक बार।"}
  }[L];
  var g=document.getElementById("sgate"), $=function(i){return document.getElementById(i)}, st=$("sg-state"), go=$("sg-go");
  g.setAttribute("dir",L==="ar"?"rtl":"ltr"); g.setAttribute("lang",L);
  $("sg-t").textContent=T.t; $("sg-s").textContent=T.s; $("sg-ch").textContent=T.ch; $("sg-n").textContent=T.n;
  $("sg-1").textContent=T.a; $("sg-2").textContent=T.b; go.textContent=T.go; $("sg-f").textContent=T.f;
  function ev(p,t){ try{ var f=function(){ window.goatcounter&&goatcounter.count&&goatcounter.count({path:p,title:t,event:true}); }; window.goatcounter&&goatcounter.count?f():setTimeout(f,2500);}catch(e){} }
  function show(){ g.hidden=false; document.documentElement.classList.add("sgate-lock"); setTimeout(function(){ try{go.focus()}catch(e){} },50); ev("gate-shown","شاشة الاشتراك ظهرت"); }
  function unlock(how){
    try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){}
    ev("gate-unlocked-"+how,"فتح الأداة بعد الاشتراك ("+how+")");
    st.innerHTML=""; var m=document.createElement("p"); m.className="gmsg good"; m.textContent=T.ok; st.appendChild(m);
    setTimeout(function(){ g.hidden=true; document.documentElement.classList.remove("sgate-lock"); },900);
  }
  function msg(cls,txt,btn){
    st.innerHTML=""; var p=document.createElement("p"); p.className=cls; p.textContent=txt; st.appendChild(p);
    if(btn){ var b=document.createElement("button"); b.type="button"; b.className="gb ok"; b.textContent=btn; b.onclick=function(){unlock("manual")}; st.appendChild(b); }
  }
  var clicked=0, leftAt=0, awayTotal=0, fallbackT=null;
  go.addEventListener("click",function(){
    clicked=Date.now(); ev("gate-sub-click","ضغط اشترك في شاشة الاشتراك");
    msg("gwait",T.wait);
    clearTimeout(fallbackT);
    /* لو المتصفح ما سابش الصفحة (نافذة جنب بعض / منع النوافذ) — نظهر زرار يدوي بعد 25 ثانية */
    fallbackT=setTimeout(function(){ if(!leftAt && !awayTotal) msg("gwait",T.wait,T.manual); },25000);
  });
  document.addEventListener("visibilitychange",function(){
    if(!clicked) return;
    if(document.hidden){ leftAt=Date.now(); return; }
    if(!leftAt) return;
    awayTotal+=Date.now()-leftAt; leftAt=0;
    if(awayTotal>=MIN_AWAY) unlock("auto");
    else { ev("gate-short","رجع بسرعة من يوتيوب"); msg("gmsg",T.short); go.textContent=T.again; }
  });
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",show); else show();
})();
